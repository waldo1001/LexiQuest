name: Azure Static Web Apps CI/CD

# Push-to-main deploy only. Pull requests are gated by ci.yml instead: SWA preview
# environments copy the production app settings (live Table Storage + Anthropic key)
# and the Free plan allows three of them, which waldo.Jarvis's League PRs would exhaust.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build and Deploy to Azure Static Web Apps
        id: swa
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "frontend"
          api_location: "api"
          output_location: "dist"
          app_build_command: "npm run build"
          api_build_command: "npm run build"

